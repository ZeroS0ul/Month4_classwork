
{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-danger shadow-sm">
        <div class="card-header bg-danger text-white">
          <h5 class="card-title mb-0">Подтверждение удаления</h5>
        </div>
        <div class="card-body p-4 text-center">
          <div class="mb-3 text-danger">
            <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="currentColor" class="bi bi-exclamation-triangle" viewBox="0 0 16 16">
              <path d="M7.938 2.016A.13.13 0 0 1 8.002 2a.13.13 0 0 1 .063.016.15.15 0 0 1 .054.057l6.857 11.667c.036.06.035.124.002.183a.2.2 0 0 1-.054.06.1.1 0 0 1-.066.017H1.146a.1.1 0 0 1-.066-.017.2.2 0 0 1-.054-.06.18.18 0 0 1 .002-.183L7.884 2.073a.15.15 0 0 1 .054-.057m1.044-.45a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767z"/>
              <path d="M7.002 12a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 5.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
            </svg>
          </div>

          <p class="fs-5 mb-2">Вы уверены, что хотите удалить пост?</p>
          <p class="fw-bold text-break fs-5 text-dark mb-3">
            «{{ post.title }}»
          </p>
          <p class="text-muted small mb-4">
            Это действие необратимо, и запись будет удалена навсегда.
          </p>

          <form method="POST">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2">
              <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                Отмена
              </a>
              <button type="submit" class="btn btn-danger px-4">
                Да, удалить
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
