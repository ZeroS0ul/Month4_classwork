<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaris</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'post_list' %}">Polaris</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'post_list' %}">Главная</a>
            </li>
            {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'my_posts' %}">Мои посты</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'create_post' %}">Создать пост</a>
                </li>
            {% endif %}
          </ul>

          <!-- Форма поиска -->
          <form class="d-flex me-lg-3 mb-2 mb-lg-0" role="search" method="GET" action="{% url 'post_list' %}">
            <input 
              class="form-control me-2" 
              type="search" 
              name="search" 
              value="{{ request.GET.search|default:'' }}" 
              placeholder="Поиск постов..." 
              aria-label="Search"
            >
            <button class="btn btn-outline-success" type="submit">Найти</button>
          </form>

          <!-- Блок аутентификации -->
          <div class="d-flex align-items-center">
            {% if user.is_authenticated %}
              <span class="navbar-text me-3 fw-medium">Привет, {{ user.username }}!</span>
              <form action="{% url 'logout' %}" method="post" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-secondary">Выйти</button>
              </form>
            {% else %}
              <a href="{% url 'login' %}" class="btn btn-outline-primary me-2">Войти</a>
              <a href="{% url 'register' %}" class="btn btn-primary">Регистрация</a>
            {% endif %}
          </div>

        </div>
      </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
